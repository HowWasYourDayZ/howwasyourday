apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    namespace "app.leanon.therapy"

    defaultConfig {
        applicationId "app.leanon.therapy"
        minSdkVersion 21
        targetSdkVersion 34
        // Version injected by CI via -PversionCode / -PversionName flags
        versionCode project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
        versionName project.hasProperty('versionName') ? project.versionName : '1.0.0'
    }

    signingConfigs {
        release {
            keyAlias     'leanon'
            keyPassword  System.getenv('KEY_PASSWORD')  ?: ''
            storeFile    file('../../leanon-keystore.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
