# Scheduled sessions: reminders + no-shows every 5 minutes (PROJECT.md §8.4).
# Vercel's free plan only runs crons daily, so GitHub Actions pings the endpoint.
# Repo secrets: CRON_SECRET (same value as Vercel's CRON_SECRET).
# GitHub may delay scheduled runs by a few minutes; no-shows are also settled
# when someone opens a booking, so a late tick only delays reminders.
name: Scheduled sessions tick
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set — skipping"; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" https://www.howwasyourday.live/api/sessions/scheduled-tick
