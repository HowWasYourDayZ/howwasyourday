name: E2E Tests

# Public-page/browser and unauthenticated API E2E coverage against the current PR preview;
# workflow_dispatch defaults to production unless a target URL is supplied.
# The authenticated journeys still assume Supabase's retired fixed-OTP test
# numbers. Production login now uses MSG91's OTP Widget, so those journeys are
# intentionally skipped unless run manually against a dedicated test deploy
# that really uses Supabase fixed-OTP auth.
#
# ── ONE-TIME SETUP (owner) ─────────────────────────────────────────────
# GitHub repo → Settings → Secrets and variables → Actions → New secret:
#   TEST_ADMIN_PASSWORD = the ADMIN_SECRET value (same as in Vercel)
# Without it, admin-approval and booking tests skip. Public/browser and
# unauthenticated API smoke tests still run.

# COST NOTE: runs spend Vercel Function CPU on deployed /api/* routes that the
# API-security tests exercise. The workflow used to fire on every push to main
# + every PR + a daily cron,
# which — with frequent direct pushes to main — became the single largest
# chunk of Fluid Active CPU on the free tier. It is now MANUAL by default
# (Actions tab → E2E Tests → Run workflow), plus PRs. Re-add the `push`/
# `schedule` triggers if the plan later has CPU headroom to spare.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment URL to test manually"
        required: false
        default: "https://www.leanon.app"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: e2e-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # PR tests must hit the successful Vercel preview for this head, not production.
      - name: Resolve Vercel preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_BASE_URL: ${{ inputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            for attempt in $(seq 1 30); do
              statuses="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/statuses")"
              vercel_state="$(jq -r '[.[] | select(.context == "Vercel")][0].state // empty' <<< "$statuses")"
              if [[ "$vercel_state" == "failure" || "$vercel_state" == "error" ]]; then
                echo "Vercel deployment failed for ${HEAD_SHA}; refusing to test a stale preview." >&2
                exit 1
              fi
              if [[ "$vercel_state" == "success" ]]; then
                comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
                preview_url="$(jq -r '[.[] | select(.user.login == "vercel[bot]") | .body | try (capture("\\[Preview\\]\\((?<url>https://[^)]+)\\)").url) catch empty] | last // empty' <<< "$comments")"
                if [[ "$preview_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
                  echo "Using deployed PR preview: $preview_url"
                  echo "base_url=$preview_url" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
              echo "Waiting for the current Vercel preview (attempt $attempt/30)..."
              sleep 10
            done
            echo "Timed out waiting for a successful Vercel preview deployment URL." >&2
            exit 1
          fi
          base_url="${MANUAL_BASE_URL:-https://www.leanon.app}"
          echo "Using manually selected URL: $base_url"
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.base_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: npx playwright test --project=chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
